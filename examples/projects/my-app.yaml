# yaml-language-server: $schema=../../schema/lazycmd-profile.schema.json
#
# Example profile: copy to ~/.config/lazycmd/projects/my-app.yaml and
# point path at one of your repos. In that repo, the deploy script offers
# that repo's services and starts on staging. Everywhere else it keeps the
# options from its sidecar. It also shows maven.goals: this repo's Spring Boot
# app runs through a company plugin, so spring-boot:run is detected by that.
# And sidecars: gives the repo's own scripts/release.sh a form without
# adding anything to the repo.
path: ~/repos/my-app

sidecars:
  scripts/release.sh:
    desc: Tag and push a release
    params:
      - { name: version, type: string, required: true, pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$' }
      - { name: push, type: bool, default: "true" }
    args: ["{version}", "--push={push}"]
    confirm: "Release {version}?"

params:
  deploy:
    services: { options: [api, billing, notifications], default: [api, billing] }

defaults:
  deploy: { env: staging, tag: "${env}-candidate" }

maven:
  goals:
    - goal: spring-boot:run
      plugin: acme-boot-maven-plugin   # the artifactId in the pom's <build><plugins>
